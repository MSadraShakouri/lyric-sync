name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push supersedes in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Copies the PWA files (including vendored libs) into www/ and bumps
      # the service worker cache name from package.json.
      - name: Prepare PWA site
        run: node scripts/prepare-www.js

      # One-time self-configuration: Pages must exist with build type
      # "workflow" (Settings -> Pages -> Source: "GitHub Actions") for
      # actions/deploy-pages to work. Note:
      #   - A Pages site that doesn't exist yet returns 404 on GET and must
      #     be created with POST (PATCH only works on an existing site).
      #   - source.branch=gh-pages would be "deploy from branch" mode, NOT
      #     GitHub Actions mode; the correct field is build_type=workflow.
      # This step is best-effort: if the GITHUB_TOKEN isn't allowed to
      # create the site, it warns instead of failing the job — the site can
      # be enabled once with:
      #   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
      - name: Ensure Pages source is GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null || echo "")
          if [ "$build_type" = "workflow" ]; then
            echo "Pages already uses the GitHub Actions source."
          elif [ -n "$build_type" ]; then
            echo "Pages exists with build type '$build_type'; switching to GitHub Actions."
            if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow; then
              echo "::warning::Could not switch Pages build type. Run once locally: gh api -X PATCH repos/$GITHUB_REPOSITORY/pages -f build_type=workflow"
            fi
          else
            echo "Pages is not enabled; enabling it with the GitHub Actions source."
            if ! gh api --method POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow; then
              echo "::warning::Could not enable Pages with GITHUB_TOKEN. Run once locally: gh api -X POST repos/$GITHUB_REPOSITORY/pages -f build_type=workflow"
            fi
          fi
          # Wait until the site record is readable before configuring.
          for _ in $(seq 1 12); do
            if gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
