name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Only one deployment at a time; a new push supersedes in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Copies the PWA files (including vendored libs) into www/ and bumps
      # the service worker cache name from package.json.
      - name: Prepare PWA site
        run: node scripts/prepare-www.js

      # One-time self-configuration: this repo's Pages source must be set to
      # GitHub Actions (branch "gh-pages") for deploy-pages to work. If it
      # isn't, set it here — no manual Settings click required.
      - name: Ensure Pages source is GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api repos/"$GITHUB_REPOSITORY"/pages --jq '.source.branch' 2>/dev/null || true)
          if [ "$current" != "gh-pages" ]; then
            echo "Pages source is '${current:-not configured}'; setting it to GitHub Actions."
            gh api --method PATCH repos/"$GITHUB_REPOSITORY"/pages \
              -f "source[branch]=gh-pages" -f "source[path]=/"
            sleep 5
          else
            echo "Pages source already GitHub Actions."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
