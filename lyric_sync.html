<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Lyric Sync</title>
    <script src="https://cdn.jsdelivr.net/npm/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1a1a1a;
        --panel: #242424;
        --panel2: #2e2e2e;
        --ink: #eee;
        --muted: #aaa;
        --accent: #62d6ff;
        --danger: #ff7878;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.35 system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
        overflow: hidden;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        touch-action: manipulation;
        border: 0;
        color: var(--ink);
        background: #3b3b3b;
        border-radius: 8px;
        cursor: pointer;
        transition:
          filter 0.08s,
          transform 0.08s;
      }
      button:active {
        filter: brightness(1.45);
        transform: scale(0.96);
      }
      .screen {
        height: 100dvh;
      }
      .hidden {
        display: none !important;
      }
      /* Start */
      #startScreen {
        overflow: auto;
        padding: clamp(20px, 7vw, 48px);
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 700px;
        margin: auto;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(26px, 7vw, 38px);
      }
      .hint {
        color: var(--muted);
        margin: 0;
      }
      .field {
        display: grid;
        gap: 8px;
      }
      .upload {
        background: var(--panel);
        border: 1px solid #444;
        border-radius: 12px;
        padding: 14px;
      }
      .upload input {
        width: 100%;
        color: var(--muted);
      }
      textarea {
        width: 100%;
        min-height: 44vh;
        resize: vertical;
        background: #111;
        color: var(--ink);
        border: 1px solid #4b4b4b;
        border-radius: 10px;
        padding: 12px;
      }
      .primary {
        background: var(--accent);
        color: #09212b;
        font-weight: 800;
        padding: 14px;
        font-size: 17px;
      }
      .primary.danger {
        background: #b3261e;
        color: #fff;
      }
      .modal p {
        margin: 0;
        color: var(--muted);
      }
      .notice {
        color: #ffd477;
        min-height: 1.3em;
      }
      /* Sync */
      #syncScreen {
        display: grid;
        grid-template-rows: 30dvh 60dvh 10dvh;
        min-height: 100dvh;
        position: relative;
      }
      .wave-area {
        position: relative;
        min-height: 0;
        border-bottom: 1px solid #444;
        background: #151515;
        overflow: hidden;
      }
      .wave-toolbar {
        position: absolute;
        z-index: 3;
        left: 8px;
        top: 8px;
        right: 8px;
        display: flex;
        justify-content: space-between;
        pointer-events: none;
        font-size: 12px;
        color: #b9dce7;
        text-shadow: 0 1px 2px #000;
      }
      .wave-toolbar > * {
        background: #0008;
        padding: 3px 6px;
        border-radius: 5px;
      }
      #waveform {
        height: 100%;
        touch-action: pan-y;
      }
      .lyrics {
        overflow-y: auto;
        overscroll-behavior: contain;
        background: #1e1e1e;
        scroll-behavior: smooth;
      }
      .block {
        min-height: 98px;
        display: flex;
        gap: 7px;
        padding: 7px 8px;
        border-bottom: 1px solid #383838;
        will-change: transform;
        transform: translateZ(0);
        transition:
          background 0.12s,
          box-shadow 0.12s;
      }
      .block.active {
        background: #17313a;
        box-shadow: inset 4px 0 var(--accent);
      }
      .block.selected {
        background: #2b2542;
        box-shadow: inset 4px 0 #a78bfa;
      }
      .left {
        width: 83px;
        flex: none;
        display: grid;
        grid-template-rows: 1fr 1.25fr 1fr;
        gap: 4px;
      }
      .stamp-time {
        font-size: 12px;
        padding: 2px 3px;
        background: #2a2a2a;
        white-space: nowrap;
      }
      .nudge {
        font-size: 11px;
      }
      .line {
        min-width: 0;
        flex: 1;
        padding: 9px 3px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        align-self: center;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      .line.empty:before {
        content: "Blank line";
        color: #747474;
        font-style: italic;
      }
      .right {
        width: 80px;
        flex: none;
        display: grid;
        grid-template-rows: 22px 1fr 22px;
        gap: 4px;
      }
      .icon {
        padding: 0;
        font-size: 16px;
        background: #303030;
      }
      .stamp {
        min-height: 48px;
        background: #ffb648;
        color: #251600;
        font-weight: 900;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
      .transport {
        position: relative;
        z-index: 5;
        border-top: 1px solid #4a4a4a;
        background: #252525;
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 56px;
        padding: 6px max(8px, env(safe-area-inset-right))
          max(6px, env(safe-area-inset-bottom))
          max(8px, env(safe-area-inset-left));
        min-width: 0;
      }
      .transport button {
        height: 32px;
        padding: 0 8px;
        font-size: 14px;
      }
      .play {
        background: var(--accent) !important;
        color: #09212b !important;
        font-weight: 900;
        font-size: 18px !important;
        min-width: 52px;
      }
      .speed {
        display: grid;
        gap: 1px;
        min-width: 70px;
        flex: 1;
        color: var(--muted);
        font-size: 11px;
        text-align: center;
      }
      .speed input {
        width: 100%;
        accent-color: var(--accent);
      }
      .export {
        font-size: 12px !important;
        padding: 0 8px !important;
        flex-shrink: 0;
      }
      /* dialogs */
      .sheet-backdrop,
      .modal-backdrop {
        position: fixed;
        z-index: 20;
        inset: 0;
        background: #0009;
        display: flex;
        align-items: flex-end;
      }
      .sheet {
        width: 100%;
        background: #303030;
        border-radius: 16px 16px 0 0;
        padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
        display: grid;
        gap: 7px;
        max-height: 70dvh;
        overflow-y: auto;
      }
      .sheet .handle {
        height: 4px;
        width: 40px;
        background: #777;
        border-radius: 9px;
        margin: 2px auto 7px;
      }
      .sheet button {
        padding: 13px;
        text-align: left;
        background: #3d3d3d;
      }
      .sheet .delete {
        color: #ff9b9b;
      }
      .modal-backdrop {
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal {
        background: #303030;
        width: min(420px, 100%);
        padding: 18px;
        border-radius: 14px;
        display: grid;
        gap: 12px;
      }
      .modal input {
        background: #161616;
        color: #eee;
        border: 1px solid #666;
        border-radius: 7px;
        padding: 11px;
        width: 100%;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .modal-actions button {
        padding: 9px 13px;
      }
      .flash {
        animation: flash 0.3s ease;
      }
      @keyframes flash {
        50% {
          background: #4c7b88;
        }
      }
      /* selection action bar */
      #selbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px;
        background: #2a2a2a;
        border-bottom: 1px solid #4a4a4a;
      }
      #selbar .count {
        margin-right: auto;
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }
      #selbar button {
        padding: 8px 10px;
        font-size: 13px;
      }
      #selbar button.danger {
        color: var(--danger);
      }
      /* toast */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 72px;
        transform: translateX(-50%) translateY(6px);
        background: #3d3d3d;
        color: var(--ink);
        padding: 9px 14px;
        border-radius: 9px;
        font-size: 13px;
        opacity: 0;
        transition:
          opacity 0.25s,
          transform 0.25s;
        z-index: 40;
        pointer-events: none;
        max-width: 80vw;
        text-align: center;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%);
      }
      /* modals with forms */
      .modal label {
        display: grid;
        gap: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      .modal textarea {
        min-height: 110px;
      }
    </style>
  </head>
  <body>
    <section id="startScreen" class="screen">
      <h1>Lyric Sync</h1>
      <p class="hint">
        Everything stays on this device. Add audio and lyrics, then stamp each
        line as it plays. Long-press a line in the editor to select several at
        once.
      </p>
      <label class="field upload"
        >Audio file
        <input id="audioInput" type="file" accept="audio/*" /></label>
      <label class="field"
        >Lyrics — one block per line
        <textarea
          id="lyricsInput"
          dir="auto"
          placeholder="Paste lyrics here…&#10;&#10;Empty lines are kept as blank blocks."
        ></textarea>
      </label>
      <label class="field upload"
        >Lyrics .txt (UTF-8, optional)
        <input id="textInput" type="file" accept=".txt,.lrc,text/plain" /></label>
      <div id="startNotice" class="notice"></div>
      <button id="beginBtn" class="primary">Start syncing</button>
    </section>
    <section id="syncScreen" class="screen hidden">
      <div id="selbar" class="hidden">
        <span class="count" id="selCount">0 selected</span
        ><button id="selCopy">Copy</button
        ><button id="selCut">Cut</button
        ><button id="selCopyBelow">Copy below</button
        ><button id="selPaste" class="hidden">Paste after</button
        ><button id="selDelete" class="danger">Delete</button
        ><button id="selCancel" aria-label="Cancel selection">✕</button>
      </div>
      <div class="wave-area">
        <div class="wave-toolbar">
          <span id="nowLabel">00:00.00</span><span>Pinch to zoom</span>
        </div>
        <div id="waveform"></div>
      </div>
      <main id="lyricsList" class="lyrics" aria-label="Lyric blocks"></main>
      <footer class="transport">
        <button id="back2" aria-label="Back 2 seconds">⏪ 2s</button
        ><button id="playBtn" class="play" aria-label="Play or pause">▶</button
        ><button id="forward2" aria-label="Forward 2 seconds">2s ⏩</button
        ><label class="speed"
          ><span id="speedLabel">1.00×</span
          ><input
            id="speedSlider"
            type="range"
            min="0.25"
            max="1.5"
            step="0.05"
            value="1" /></label
        ><button id="exportBtn" class="export">Export .lrc</button>
      </footer>
    </section>
    <div id="overlay"></div>
    <script>
      (() => {
        "use strict";
        const $ = (s) => document.querySelector(s),
          storeKey = "lyric-sync-session-v1";
        let ws = null,
          blocks = [],
          activeId = null,
          speed = 1,
          zoom = 80,
          audioName = "",
          audioData = null,
          raf = 0,
          lastAutoId = null,
          stampedCache = null,
          blocksVersion = 0,
          syncHistoryPushed = false,
          pinch = null;
        let wasPlaying = false;
        let pendingResume = false;
        // multi-select + internal text clipboard (no timestamps)
        let selMode = false;
        const selIds = new Set();
        let clip = [];
        let suppressClick = 0;
        function defaultMeta() {
          return { ti: "", ar: "", al: "", au: "", by: "" };
        }
        let meta = defaultMeta();
        const ids = () =>
          crypto.randomUUID
            ? crypto.randomUUID()
            : "b" + Date.now() + Math.random().toString(36).slice(2);
        const fmt = (ms) => {
          if (ms == null) return "[--:--]";
          ms = Math.max(0, Math.round(ms));
          let c = Math.floor(ms / 10) % 100,
            s = Math.floor(ms / 1000) % 60,
            m = Math.floor(ms / 60000);
          return `[${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${String(c).padStart(2, "0")}]`;
        };
        const getTime = () => (ws ? Math.round(ws.getCurrentTime() * 1000) : 0);
        function save() {
          try {
            localStorage.setItem(
              storeKey,
              JSON.stringify({
              audioName,
              audioData,
              blocks,
              speed,
              zoom,
              meta,
            }),
            );
          } catch (e) {
            console.warn(e);
            $("#startNotice").textContent =
              "Session saved without audio: browser storage is full.";
          }
        }
        function setScreen(sync) {
          $("#startScreen").classList.toggle("hidden", sync);
          $("#syncScreen").classList.toggle("hidden", !sync);
          if (sync) {
            // Web only: put a dummy history entry in place so the browser
            // back button can be intercepted instead of navigating away.
            if (!isNative && !syncHistoryPushed) pushSyncHistory();
          } else {
            syncHistoryPushed = false;
          }
        }
        /* Parses plain lyrics or an existing LRC file into blocks.
           Handles: header tags [ti]/[ar]/[al]/[au]/[by], [offset:],
           condensed multi-timestamp lines, 2- and 3-digit milliseconds,
           CRLF line endings. Fully-stamped input is sorted by time. */
        const TS_RE = /^\[(\d{2}):(\d{2})[.:](\d{2,3})\]/;
        const TAG_RE = /^\[\s*(ti|ar|al|au|by)\s*:\s*([^\]]*)\s*\]$/i;
        const OFFSET_RE = /^\[\s*offset\s*:\s*(-?\d+)\s*\]$/i;
        const TAG_ANY_RE = /^\[[a-zA-Z][a-zA-Z0-9]*\s*:[^\]]*\]$/;
        function parseLrc(text) {
          if (!text.trim()) return { blocks: [], meta: defaultMeta() };
          const lines = text.replace(/\r\n?/g, "\n").split("\n");
          const result = [];
          const m = defaultMeta();
          let offset = 0;
          for (const raw of lines) {
            const line = raw.trim();
            const tag = line.match(TAG_RE);
            if (tag) {
              m[tag[1].toLowerCase()] = tag[2].trim();
              continue;
            }
            const off = line.match(OFFSET_RE);
            if (off) {
              offset += parseInt(off[1], 10);
              continue;
            }
            // Strip (possibly several) leading timestamps
            let rest = line;
            let count = 0;
            let stripped = false;
            for (;;) {
              const t = rest.match(TS_RE);
              if (!t) break;
              const sec = parseInt(t[2], 10);
              if (sec >= 60) {
                rest = rest.slice(t[0].length); // invalid stamp; drop it
                stripped = true;
                continue;
              }
              const msDigits = t[3];
              const ms =
                (parseInt(t[1], 10) * 60 + sec) * 1000 +
                (msDigits.length === 3
                  ? parseInt(msDigits, 10)
                  : parseInt(msDigits, 10) * 10);
              result.push({ id: ids(), text: null, timestamp: ms });
              rest = rest.slice(t[0].length);
              count++;
            }
            if (count > 0) {
              const txt = rest.trim();
              for (let i = result.length - count; i < result.length; i++)
                result[i].text = txt;
            } else if (TAG_ANY_RE.test(line)) {
              // Unknown tag line ([re:], [ve:], ...) — not a lyric
            } else {
              // No timestamp – keep line as is (unless a bad stamp was stripped)
              result.push({ id: ids(), text: stripped ? rest.trim() : raw, timestamp: null });
            }
          }
          if (offset !== 0)
            for (const b of result)
              if (b.timestamp != null)
                b.timestamp = Math.max(0, b.timestamp + offset);
          if (
            result.length > 0 &&
            result.every((b) => b.timestamp != null)
          )
            result.sort((a, b) => a.timestamp - b.timestamp);
          return { blocks: result, meta: m };
        }
        function render() {
          const list = $("#lyricsList");
          list.innerHTML = "";
          blocks.forEach((b, i) => {
            const el = document.createElement("article");
            el.className =
              "block" +
              (b.id === activeId ? " active" : "") +
              (selMode && selIds.has(b.id) ? " selected" : "");
            el.dataset.id = b.id;
            el.innerHTML = `<div class="left"><button class="nudge" data-act="plus">+0.1</button><button class="stamp-time" data-act="time">${fmt(b.timestamp)}</button><button class="nudge" data-act="minus">−0.1</button></div><div class="line ${b.text === "" ? "empty" : ""}" data-act="select" dir="auto">${escapeHTML(b.text)}</div><div class="right"><button class="icon" data-act="from" aria-label="Play from here">▶</button><button class="stamp" data-act="stamp">STAMP</button><button class="icon" data-act="more" aria-label="More options">⋯</button></div>`;
            list.append(el);
          });
        }
        function escapeHTML(s) {
          return s.replace(
            /[&<>'"]/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "'": "&#39;",
                '"': "&quot;",
              })[c],
          );
        }
        function select(id, seek = false, center = false) {
          activeId = id;
          render();
          const b = blocks.find((x) => x.id === id);
          if (seek && b?.timestamp != null) ws.setTime(b.timestamp / 1000);
          if (center) {
            requestAnimationFrame(() =>
              document
                .querySelector(`.block[data-id="${id}"]`)
                ?.scrollIntoView({ block: "center", behavior: "smooth" }),
            );
          }
        }
        function change(id, fn) {
          const b = blocks.find((x) => x.id === id);
          if (!b) return;
          fn(b);
          bumpBlocks();
          save();
          render();
        }
        function waveInit(data) {
          if (typeof WaveSurfer === "undefined") {
            $("#startNotice").textContent =
              "The waveform library could not be loaded. Check your connection and reload the page.";
            setScreen(false);
            return;
          }
          if (ws) ws.destroy();
          ws = WaveSurfer.create({
            container: "#waveform",
            url: data,
            height: Math.max(80, innerHeight * 0.3),
            waveColor: "#527985",
            progressColor: "#62d6ff",
            cursorColor: "#fff",
            cursorWidth: 2,
            barWidth: 2,
            barGap: 1,
            normalize: true,
            autoScroll: true,
            autoCenter: true,
            dragToSeek: true,
            minPxPerSec: zoom,
          });
          ws.on("ready", () => {
            ws.setPlaybackRate(speed);
            $("#nowLabel").textContent = fmt(0).slice(1, -1);
          });
          ws.on("play", () => {
            if (raf) {
              cancelAnimationFrame(raf);
              raf = 0;
            }
            updatePlay(); // icon flips immediately
            tick();       // highlight work after
          });
          ws.on("pause", () => {
            // Stop the animation loop when paused
            if (raf) {
              cancelAnimationFrame(raf);
              raf = 0;
            }
            updatePlay();
          });
          ws.on("finish", () => {
            if (raf) {
              cancelAnimationFrame(raf);
              raf = 0;
            }
            updatePlay();
          });
        }
        function updatePlay() {
          $("#playBtn").textContent = ws && !ws.isPlaying() ? "▶" : "❚❚";
        }
        function bumpBlocks() {
          blocksVersion++;
          stampedCache = null;
        }
        function getStamped() {
          // Rebuilt lazily: only when blocks/timestamps actually change.
          if (stampedCache === null) {
            stampedCache = blocks.filter((b) => b.timestamp != null);
          }
          return stampedCache;
        }
        function highlight(id) {
          // Class toggle instead of a full render(): the tick loop must never
          // rebuild the whole lyrics list (that is what made playback janky).
          if (id === activeId) return false;
          const prev = document.querySelector(".block.active");
          const next = document.querySelector(`.block[data-id="${id}"]`);
          activeId = id;
          if (prev) prev.classList.remove("active");
          if (next) next.classList.add("active");
          return true;
        }
        function tick() {
          if (!ws || !ws.isPlaying()) return;
          if (raf) {
            cancelAnimationFrame(raf);
            raf = 0;
          }
          const t = getTime();
          $("#nowLabel").textContent = fmt(t).slice(1, -1);

          const stamped = blocks.filter((b) => b.timestamp != null);
          if (stamped.length) {
            // Closest stamped line (original behavior)
            let closest = stamped[0];
            let best = Math.abs(closest.timestamp - t);
            for (let i = 1; i < stamped.length; i++) {
              const d = Math.abs(stamped[i].timestamp - t);
              if (d < best) {
                best = d;
                closest = stamped[i];
              }
            }
            if (closest.id !== activeId) {
              // Class toggle instead of full render
              const prev = document.querySelector(".block.active");
              const next = document.querySelector(`.block[data-id="${closest.id}"]`);
              activeId = closest.id;
              if (prev) prev.classList.remove("active");
              if (next) next.classList.add("active");
              // Auto-scroll
              if (lastAutoId !== closest.id) {
                lastAutoId = closest.id;
                document
                  .querySelector(`.block[data-id="${closest.id}"]`)
                  ?.scrollIntoView({ block: "center", behavior: "smooth" });
              }
            }
          }
          raf = requestAnimationFrame(tick);
        }
        function stamp(id) {
          change(id, (b) => (b.timestamp = getTime()));
          activeId = id;
          render();
          document
            .querySelector(`.block[data-id="${id}"]`)
            ?.classList.add("flash");
        }
        function showSheet(id) {
          // Pause audio if playing
          wasPlaying = ws?.isPlaying() || false;
          if (wasPlaying && ws) ws.pause();
          pendingResume = false;

          const b = blocks.find((x) => x.id === id);
          const hasTime = b?.timestamp != null;
          $("#overlay").innerHTML =
            `<div class="sheet-backdrop"><div class="sheet"><div class="handle"></div>
            <button data-menu="edit">Edit line</button>
            <button data-menu="insertbelow">Insert lines below</button>
            ${clip.length ? '<button data-menu="paste">Paste below</button>' : ""}
            <button data-menu="copy">Copy</button>
            <button data-menu="copybelow">Copy below</button>

          if (selMode) {
            exitSelMode();
            return;
          }
          const overlay = $("#overlay");
          if (overlay && overlay.innerHTML.trim() !== "") {
            closeOverlay(); // sheet / edit modal / dialog: back acts as Cancel
            return;
          }
          const onSync = !$("#syncScreen").classList.contains("hidden");
          if (onSync) {
            showConfirmDialog(
              "Return to main?",
              "Your progress will be saved.",
              "Return",
              false,
              returnToMain,
            );
          } else {
            showConfirmDialog(
              "Exit?",
              "Are you sure you want to exit?",
              "Exit",
              true,
              () => {
                const app =
                  window.Capacitor &&
                  window.Capacitor.Plugins &&
                  window.Capacitor.Plugins.App;
                if (app && typeof app.exitApp === "function") {
                  try {
                    app.exitApp();
                  } catch (e) {}
                }
              },
            );
          }
        }
        function handlePopState() {
          // Web browser back button.
          if (isNative) return;
          const overlay = $("#overlay");
          const onSync = !$("#syncScreen").classList.contains("hidden");
          if (selMode && onSync) {
            exitSelMode();
            pushSyncHistory();
            return;
          }
          if (overlay && overlay.innerHTML.trim() !== "") {
            closeOverlay(); // back while dialog open = Cancel
            if (onSync) pushSyncHistory(); // keep one dummy so back still works
            return;
          }
          if (!onSync) return; // start screen: let the browser navigate away
          showConfirmDialog(
            "Return to main?",
            "Your progress will be saved.",
            "Return",
            false,
            () => {
              returnToMain();
              // This popstate already consumed the previous dummy, and a
              // fresh one was pushed when the dialog opened. Pop that one
              // so history is clean — it is a same-document entry, so no
              // real navigation happens.
              try {
                history.back();
              } catch (e) {}
            },
          );
          pushSyncHistory(); // guard the real entry while the dialog is open
        }
        function registerBackHandling() {
          const app =
            window.Capacitor &&
            window.Capacitor.Plugins &&
            window.Capacitor.Plugins.App;
          if (app && typeof app.addListener === "function") {
            app.addListener("backButton", handleBack);
            return;
          }
          if (!isNative) {
            window.addEventListener("popstate", handlePopState);
            return;
          }
          console.warn(
            "Capacitor App plugin found but addListener missing; back button not intercepted",
          );
        }

        function addPinch() {
          let el = $("#waveform");
          el.addEventListener(
            "touchstart",
            (e) => {
              if (e.touches.length === 2) {
                pinch = {
                  distance: Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY,
                  ),
                  zoom,
                };
              }
            },
            { passive: true },
          );
          el.addEventListener(
            "touchmove",
            (e) => {
              if (!pinch || e.touches.length !== 2) return;
              let d = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY,
              );
              zoom = Math.max(
                15,
                Math.min(500, (pinch.zoom * d) / pinch.distance),
              );
              ws?.zoom(zoom);
              save();
            },
            { passive: true },
          );
          el.addEventListener(
            "touchend",
            (e) => {
              if (e.touches.length < 2) pinch = null;
            },
            { passive: true },
          );
        }
        addPinch();
        try {
          let saved = JSON.parse(localStorage.getItem(storeKey) || "null");
          if (saved?.audioData && Array.isArray(saved.blocks)) {
            ({ blocks, speed, zoom, audioName, audioData } = saved);
            meta =
              saved.meta && typeof saved.meta === "object"
                ? { ...defaultMeta(), ...saved.meta }
                : defaultMeta();
            blocks = blocks.map((b) => ({
              id: b.id || ids(),
              text: String(b.text ?? ""),
              timestamp: Number.isFinite(b.timestamp) ? b.timestamp : null,
            }));
            activeId = blocks[0]?.id || null;
            bumpBlocks();
            $("#speedSlider").value = speed;
            $("#speedLabel").textContent = speed.toFixed(2) + "×";
            setScreen(true);
            render();
            waveInit(audioData);
          }
        } catch (e) {
          console.warn("No usable saved session", e);
        }
        registerBackHandling();

        // Small debug/test hook (also handy in DevTools)
        window.LyricSync = {
          parseLrc,
          buildLrc,
          player: () => ws,
          getState: () => ({
            blocks,
            clip: clip.slice(),
            selMode,
            meta: { ...meta },
            audioName,
          }),
        };
      })();
    </script>
  </body>
</html>
